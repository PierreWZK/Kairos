# ---------------------------------------------------------------------------
# Kairos · intégration continue
#
# À chaque push et pull request : les tests tournent sur PHP 8.4 + MySQL 8.4,
# et l'image Docker de production est construite (sans être publiée).
# Le déploiement est fait par Coolify à chaque push sur main.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP 8.4 · MySQL 8.4)
    runs-on: ubuntu-latest

    # Base MySQL temporaire, même moteur qu'en production
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Doctrine ajoute le suffixe _test : la base de test s'appelle kairos_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kairos?serverVersion=8.4.0&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, zip
          coverage: none

      - name: Dépendances Composer (avec cache)
        uses: ramsey/composer-install@v3

      - name: Vérifications (conteneur, Twig, YAML)
        run: |
          php bin/console lint:container
          php bin/console lint:twig templates
          php bin/console lint:yaml config --parse-tags

      - name: Base de test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          # Le schéma de la base correspond-il aux entités ?
          php bin/console doctrine:schema:validate --env=test

      - name: Tests
        run: php bin/phpunit

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

