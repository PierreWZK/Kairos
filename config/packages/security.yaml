security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Le propriétaire a tous les droits d'un membre
    role_hierarchy:
        ROLE_COMPANY_OWNER: ROLE_COMPANY_MEMBER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Refuse la connexion des entreprises suspendues
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # L'espace entreprise ; le super-admin y est renvoyé vers EasyAdmin
                default_target_path: app_space
            # 5 essais par minute et par identifiant/adresse IP, contre la force brute
            login_throttling:
                max_attempts: 5
            logout:
                path: app_logout
                target: app_home

    # Note: Only the *first* matching rule is applied
    access_control:
        # EasyAdmin : réservé au super-admin de la plateforme
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        # Espace entreprise : connecté (les contrôleurs vérifient l'entreprise et le rôle)
        - { path: ^/espace, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
