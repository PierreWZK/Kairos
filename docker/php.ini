; Réglages PHP de production (ajoutés à php.ini-production)
expose_php = Off
memory_limit = 256M

; Les logos font 1 Mo au plus (LogoStorage::MAX_BYTES)
upload_max_filesize = 2M
post_max_size = 8M

; Le code ne change pas dans un conteneur : inutile de revérifier les fichiers
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

date.timezone = UTC
